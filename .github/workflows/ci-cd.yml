name: Build Scratch iOS IPA

on:
  push:
    branches: [ main, develop ]

jobs:
  build-ios:
    runs-on: macos-latest # Sử dụng môi trường máy Mac đám mây của GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies & Build Web
        run: |
          npm install
          BUILD_MODE=dist npm run build

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init ScratchApp com.scratch.app --web-dir build
          npx cap add ios
          npx cap copy ios

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ScratchApp-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scratch-Unsigned-IPA
          path: ScratchApp-Unsigned.ipa