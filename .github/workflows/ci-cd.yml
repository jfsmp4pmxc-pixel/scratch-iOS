name: Build Scratch iOS IPA

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          npm install
          BUILD_MODE=dist npm run build

      - name: Setup Capacitor CLI & Core
        run: |
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5
          npx cap init ScratchApp com.scratch.app --web-dir build

      - name: Add iOS Platform
        run: |
          npx cap add ios

      - name: Fix Podfile Target & Install Pods
        run: |
          sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/" ios/App/Podfile
          cd ios/App
          pod install

      - name: Sync Capacitor Asset
        run: |
          npx cap copy ios

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ScratchApp-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scratch-Unsigned-IPA
          path: ScratchApp-Unsigned.ipa
